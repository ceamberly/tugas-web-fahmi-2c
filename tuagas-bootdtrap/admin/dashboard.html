<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | Portfolio</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

</head>


<body>

    <main class="admin-login">

        <div class="login-card">

            <div class="login-logo">
                P.
            </div>

            <h1>Admin Dashboard</h1>

            <p class="login-description">
                Selamat datang di area pengelolaan portfolio.
            </p>


            <div class="d-grid gap-3">

                <button
                    class="login-button"
                    onclick="alert('Fitur Edit Profile akan kita buat berikutnya.')"
                >
                    Edit Profile
                </button>


                <button
                    class="login-button"
                    onclick="alert('Fitur Edit About akan kita buat berikutnya.')"
                >
                    Edit About
                </button>


                <button
                    class="login-button"
                    onclick="alert('Fitur Edit Skills akan kita buat berikutnya.')"
                >
                    Edit Skills
                </button>


                <button
                    class="login-button"
                    onclick="alert('Fitur Edit Projects akan kita buat berikutnya.')"
                >
                    Edit Projects
                </button>


                <button
                    class="login-button"
                    onclick="logoutAdmin()"
                >
                    Logout
                </button>

            </div>


            <a
                href="../index.html"
                class="back-link"
            >
                ← Lihat Portfolio
            </a>

        </div>

    </main>


    <script>

        /* =====================================================
           CEK ADMIN
           ===================================================== */

        const isAdmin =
            localStorage.getItem(
                "portfolioAdmin"
            );


        if (isAdmin !== "true") {

            window.location.href =
                "index.html";

        }


        /* =====================================================
           LOGOUT
           ===================================================== */

        function logoutAdmin() {

            localStorage.removeItem(
                "portfolioAdmin"
            );

            window.location.href =
                "index.html";

        }

    </script>

</body>

</html>
